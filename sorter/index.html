<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Access Point Sorter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f4ee;--panel:#fff;--ink:#1d2a2e;--mute:#5d6b70;--line:#d9d6cb;--pub:#2e8b57;--per:#2f6fb5;--uns:#d98e04;--acc:#1d5c63;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--panel:#1d2427;--ink:#e6ecee;--mute:#9aa9ae;--line:#33403f;--pub:#4cb97f;--per:#6aa3e6;--uns:#f0b030;--acc:#6bc3cc;--bad:#f2867f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 8px 0 0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:36px}
button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button.primary{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button.danger{color:var(--bad)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:baseline}
main{flex:1;display:flex;min-height:0}
#map{flex:1;min-width:0}
aside{width:380px;max-width:45%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#list{overflow:auto;flex:1}
.row{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:var(--bg)}
.row small{color:var(--mute);display:block}
#detail{overflow:auto;padding:12px;flex:1}
#detail label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.note{font-size:13px;color:var(--mute)}
#msg{padding:6px 12px;font-size:13px;background:var(--bg);border-bottom:1px solid var(--line);min-height:28px}
#msg.err{color:var(--bad)}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:2000}
#cfg div{background:var(--panel);padding:16px;border-radius:10px;max-width:420px;width:100%}
.hint{position:absolute;z-index:1000;left:50%;transform:translateX(-50%);top:10px;background:var(--acc);color:var(--bg);padding:6px 12px;border-radius:6px}
#detail .bar{position:sticky;bottom:0;background:var(--panel);padding:10px 0;margin-top:12px;border-top:1px solid var(--line)}
.leaflet-control-layers{font-size:16px;padding:6px 12px}.leaflet-control-layers label{padding:7px 0;margin:0}
.leaflet-control-layers-selector{width:20px;height:20px;vertical-align:middle}
#go{max-width:230px}
#msg button{min-height:28px;padding:2px 10px;margin-left:8px}
@media (max-width:760px){main{flex-direction:column}#map{flex:none;height:42vh}aside{width:100%;max-width:none;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Access Point Sorter</h1>
  <div class="chips" id="classChips"></div>
  <label class="note"><input type="checkbox" id="unrev" style="width:auto"> Unreviewed only</label>
  <input id="q" type="search" placeholder="Filter list…" style="max-width:150px">
  <form id="goForm" style="display:flex;gap:6px"><input id="go" type="search" placeholder="Go to: postcode, grid ref, place"><button type="submit">Go</button></form>
  <button id="addBtn">+ Add point</button>
  <button id="csvBtn">Export CSV</button>
  <button id="cfgBtn">Settings</button>
</header>
<div id="msg" role="status"></div>
<main>
  <div id="map" style="position:relative"></div>
  <aside>
    <div id="detail" hidden></div>
    <div id="list"></div>
  </aside>
</main>
<div id="cfg"><div>
  <b>Connect to the sheet</b>
  <p class="note">Paste the web-app URL from Apps Script and your key. They are kept only in this browser.</p>
  <label class="note">Web-app URL</label><input id="cfgUrl" autocomplete="off">
  <label class="note">Key</label><input id="cfgKey" type="password" autocomplete="off">
  <div class="btns"><button class="primary" id="cfgSave">Save</button><button id="cfgCancel">Cancel</button></div>
</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
var CLS=['Public','Personal','Unsure'];
var COL={Public:'var(--pub)',Personal:'var(--per)',Unsure:'var(--uns)'};
var HEX={Public:'#2e8b57',Personal:'#2f6fb5',Unsure:'#d98e04'};
var pts=[],byId={},markers={},sel=null,moving=null,newPos=null,filt={cls:'All',unrev:false,q:''},adding=false,pending=null;
var $=function(id){return document.getElementById(id)};
function h(tag,attrs){var e=document.createElement(tag);for(var k in (attrs||{})){var v=attrs[k];if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,String(v))}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c)}return e}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function msg(t,err){var m=$('msg');m.textContent=t||'';m.className=err?'err':''}
function nm(p){return p.public_name||p.name}
var cfg={url:store('aps_url')||'',key:store('aps_key')||''};

/* ---- map ---- */
var map=L.map('map',{zoomControl:true}).setView([52.5,-1.5],6);
var osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
L.control.layers({'Map':osm,'Satellite':sat},null,{position:'topright',collapsed:false}).addTo(map);
var layer=L.layerGroup().addTo(map),draft=null;
map.on('click',function(e){
  if(!adding&&!moving)return;
  var pos={lat:+e.latlng.lat.toFixed(6),lon:+e.latlng.lng.toFixed(6)};
  var h0=$('hintbar');if(h0)h0.remove();$('map').style.cursor='';
  if(draft)map.removeLayer(draft);
  draft=L.circleMarker(e.latlng,{radius:9,color:'#000',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map);
  if(adding){adding=false;pending=pos;showDetail(null)}
  else{var id=moving;moving=null;newPos=pos;showDetail(byId[id])}});
function hint(t){var o=$('hintbar');if(o)o.remove();$('map').appendChild(h('div',{'class':'hint',id:'hintbar',text:t}));$('map').style.cursor='crosshair'}

/* ---- go to (navigation only; nothing is stored) ---- */
var found=null;
function d2r(d){return d*Math.PI/180}function r2d(r){return r*180/Math.PI}
function gridToLatLon(ref){
  var m=/^([A-HJ-Z])\s*([A-HJ-Z])\s*((?:\d\s*){2,10})$/i.exec(ref.trim());if(!m)return null;
  var dg=m[3].replace(/\s+/g,'');if(dg.length%2)return null;
  var A='ABCDEFGHJKLMNOPQRSTUVWXYZ',l1=A.indexOf(m[1].toUpperCase()),l2=A.indexOf(m[2].toUpperCase());
  var e100=((l1-2)%5)*5+(l2%5),n100=(19-Math.floor(l1/5)*5)-Math.floor(l2/5);
  if(e100<0||e100>6||n100<0||n100>12)return null;
  var half=dg.length/2,pad=function(x){return (x+'00000').slice(0,5)};
  var E=+(e100+pad(dg.slice(0,half))),N=+(n100+pad(dg.slice(half)));
  var a=6377563.396,b=6356256.909,F0=0.9996012717,phi0=d2r(49),lam0=d2r(-2),N0=-100000,E0=400000;
  var e2=1-b*b/(a*a),n=(a-b)/(a+b),n2=n*n,n3=n2*n,phi=phi0,M=0;
  do{phi=(N-N0-M)/(a*F0)+phi;
    var Ma=(1+n+1.25*n2+1.25*n3)*(phi-phi0),Mb=(3*n+3*n2+21/8*n3)*Math.sin(phi-phi0)*Math.cos(phi+phi0),
        Mc=(15/8*n2+15/8*n3)*Math.sin(2*(phi-phi0))*Math.cos(2*(phi+phi0)),Md=35/24*n3*Math.sin(3*(phi-phi0))*Math.cos(3*(phi+phi0));
    M=b*F0*(Ma-Mb+Mc-Md)}while(Math.abs(N-N0-M)>=0.00001);
  var c=Math.cos(phi),sn=Math.sin(phi),nu=a*F0/Math.sqrt(1-e2*sn*sn),rho=a*F0*(1-e2)/Math.pow(1-e2*sn*sn,1.5),eta2=nu/rho-1,
      t=Math.tan(phi),t2=t*t,t4=t2*t2,t6=t4*t2,sec=1/c,nu3=nu*nu*nu,nu5=nu3*nu*nu,nu7=nu5*nu*nu,
      VII=t/(2*rho*nu),VIII=t/(24*rho*nu3)*(5+3*t2+eta2-9*t2*eta2),IX=t/(720*rho*nu5)*(61+90*t2+45*t4),
      X=sec/nu,XI=sec/(6*nu3)*(nu/rho+2*t2),XII=sec/(120*nu5)*(5+28*t2+24*t4),XIIA=sec/(5040*nu7)*(61+662*t2+1320*t4+720*t6),
      dE=E-E0,dE2=dE*dE,dE3=dE2*dE,dE4=dE2*dE2,dE5=dE3*dE2,dE6=dE4*dE2,dE7=dE5*dE2;
  var la=phi-VII*dE2+VIII*dE4-IX*dE6,lo=lam0+X*dE-XI*dE3+XII*dE5-XIIA*dE7;
  /* OSGB36 -> WGS84 (Helmert) */
  var x=nu*Math.cos(la)*Math.cos(lo),y=nu*Math.cos(la)*Math.sin(lo),z=(nu*(1-e2))*Math.sin(la);
  nu=a/Math.sqrt(1-e2*Math.sin(la)*Math.sin(la));x=nu*Math.cos(la)*Math.cos(lo);y=nu*Math.cos(la)*Math.sin(lo);z=nu*(1-e2)*Math.sin(la);
  var as=Math.PI/648000,s1=-20.4894/1e6,tx=446.448,ty=-125.157,tz=542.060,rx=0.1502*as,ry=0.2470*as,rz=0.8421*as;
  var x2=tx+x*(1+s1)-y*rz+z*ry,y2=ty+x*rz+y*(1+s1)-z*rx,z2=tz-x*ry+y*rx+z*(1+s1);
  var aw=6378137,bw=6356752.314245,ew=1-bw*bw/(aw*aw),p=Math.sqrt(x2*x2+y2*y2),ph=Math.atan2(z2,p*(1-ew)),pr;
  do{pr=ph;var nv=aw/Math.sqrt(1-ew*Math.sin(ph)*Math.sin(ph));ph=Math.atan2(z2+ew*nv*Math.sin(ph),p)}while(Math.abs(ph-pr)>1e-12);
  return {lat:r2d(ph),lon:r2d(Math.atan2(y2,x2))}}
function jump(lat,lon,label){
  if(found)map.removeLayer(found);
  map.setView([lat,lon],16);
  found=L.circleMarker([lat,lon],{radius:11,color:'#c0392b',weight:3,fillColor:'#c0392b',fillOpacity:.25}).addTo(map);
  var box=h('div',{},h('b',{text:label}),h('br'),h('button',{text:'Add point here',onclick:function(){map.closePopup();if(draft)map.removeLayer(draft);pending={lat:+lat.toFixed(6),lon:+lon.toFixed(6)};showDetail(null)}}));
  found.bindPopup(box).openPopup();msg('Jumped to '+label+'.')}
$('goForm').addEventListener('submit',function(ev){ev.preventDefault();
  var q=$('go').value.trim();if(!q)return;
  var ll=/^(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)$/.exec(q);
  if(ll)return jump(+ll[1],+ll[2],q);
  var g=gridToLatLon(q);if(g)return jump(g.lat,g.lon,q.toUpperCase());
  var pc=/^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i.test(q);
  msg('Searching…');
  var url=pc?'https://api.postcodes.io/postcodes/'+encodeURIComponent(q):'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);
  fetch(url).then(function(r){return r.json()}).then(function(j){
    if(pc){if(j.status===200)jump(j.result.latitude,j.result.longitude,q.toUpperCase());else msg('Postcode not found.',true)}
    else if(j.length)jump(+j[0].lat,+j[0].lon,j[0].display_name.split(',').slice(0,2).join(','));else msg('Nothing found for "'+q+'".',true)
  }).catch(function(){msg('Search failed. Check your connection.',true)})});

/* ---- data ---- */
function api(method,body){
  if(!cfg.url||!cfg.key){openCfg();return Promise.reject(new Error('Not connected'))}
  var p=method==='GET'?fetch(cfg.url+(cfg.url.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(cfg.key)):
    fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:cfg.key},body))});
  return p.then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
function norm(p){p.lat=parseFloat(p.lat);p.lon=parseFloat(p.lon);p.reviewed=(p.reviewed===true||String(p.reviewed).toUpperCase()==='TRUE');
  if(CLS.indexOf(p['class'])<0)p['class']='Unsure';return p}
function load(){msg('Loading…');api('GET').then(function(j){pts=j.points.map(norm);byId={};pts.forEach(function(p){byId[p.id]=p});msg(pts.length+' points loaded.');render()}).catch(function(e){msg('Could not load: '+e.message,true)})}
function save(id,fields,okMsg){msg('Saving…');var p=byId[id];Object.assign(p,fields);
  return api('POST',{action:'update',id:id,fields:fields}).then(function(){msg(okMsg||'Saved.');render()}).catch(function(e){msg('Not saved: '+e.message,true)})}

/* ---- render ---- */
function shown(){var q=filt.q.toLowerCase();return pts.filter(function(p){
  if(filt.cls!=='All'&&p['class']!==filt.cls)return false;
  if(filt.unrev&&p.reviewed)return false;
  if(q&&(nm(p)+' '+p.river).toLowerCase().indexOf(q)<0)return false;
  return true})}
function render(){
  var s=shown();
  layer.clearLayers();markers={};
  s.forEach(function(p){if(isNaN(p.lat)||isNaN(p.lon))return;
    var m=L.circleMarker([p.lat,p.lon],{radius:p.id===sel?10:7,color:p.reviewed?'#fff':'#000',weight:p.id===sel?3:1.5,fillColor:HEX[p['class']],fillOpacity:.9});
    m.on('click',function(ev){L.DomEvent.stopPropagation(ev);if(!adding)select(p.id)});
    m.bindTooltip(nm(p));m.addTo(layer);markers[p.id]=m});
  var l=$('list');l.textContent='';
  s.forEach(function(p){l.appendChild(h('div',{'class':'row'+(p.id===sel?' sel':''),onclick:function(){select(p.id,true)}},
    h('span',{'class':'dot',style:'background:'+COL[p['class']]}),nm(p)+(p.reviewed?'':' •'),
    h('small',{text:[p.river,p['class']].filter(Boolean).join(' · ')})))});
  if(!s.length)l.appendChild(h('div',{'class':'row',text:'No points match.'}));
  chips()}
function chips(){var c=$('classChips');c.textContent='';
  ['All'].concat(CLS).forEach(function(k){var n=k==='All'?pts.length:pts.filter(function(p){return p['class']===k}).length;
    c.appendChild(h('button',{'aria-pressed':filt.cls===k,onclick:function(){filt.cls=k;render()}},k+' '+n))})}
function select(id,pan){sel=id;if(draft){map.removeLayer(draft);draft=null}pending=null;var p=byId[id];
  if(pan&&p&&!isNaN(p.lat))map.setView([p.lat,p.lon],Math.max(map.getZoom(),13));
  showDetail(p);render()}

/* ---- detail ---- */
function showDetail(p){
  var d=$('detail');d.textContent='';d.hidden=false;$('list').style.display='none';
  var isNew=!p,f={};
  function inp(k,area){var e=area?h('textarea',{rows:4}):h('input',{});e.value=p?(k==='name'?nm(p):(p[k]==null?'':p[k])):'';f[k]=e;return e}
  d.appendChild(h('button',{onclick:closeDetail,text:'← List'}));
  d.appendChild(h('h2',{text:isNew?'New access point':nm(p),style:'margin:10px 0 0;font-size:17px'}));
  var pos=isNew?pending:(newPos||{lat:p.lat,lon:p.lon});
  d.appendChild(h('div',{'class':'note',text:'Position '+pos.lat+', '+pos.lon+(newPos&&!isNew?'  (new, not yet saved)':'')}));
  [['Name','name'],['River','river']].forEach(function(it){d.appendChild(h('label',{text:it[0]}));d.appendChild(inp(it[1]))});
  d.appendChild(h('label',{text:'Description (river bank and features first, then parking)'}));d.appendChild(inp('public_description',true));
  if(!isNew){
    d.appendChild(h('label',{text:'Classification'}));
    var b=h('div',{'class':'btns'});
    CLS.forEach(function(c){b.appendChild(h('button',{'aria-pressed':p['class']===c,onclick:function(){
      save(p.id,{'class':c,reviewed:true,last_checked:today()},nm(p)+' → '+c).then(function(){showDetail(byId[p.id])})}},
      h('span',{'class':'dot',style:'background:'+COL[c]}),c))});
    d.appendChild(b);
    d.appendChild(h('div',{'class':'note',text:p.reviewed?'Reviewed '+(p.last_checked||''):'Not yet reviewed'}));
  }
  var bar=h('div',{'class':'bar btns'});
  function fields(){return {name:f.name.value.trim(),public_name:f.name.value.trim(),river:f.river.value.trim(),public_description:f.public_description.value.trim()}}
  if(isNew){
    bar.appendChild(h('button',{'class':'primary',text:'Add point',onclick:function(){
      var fl=fields();if(!fl.name){msg('A name is needed.',true);return}
      fl.lat=pending.lat;fl.lon=pending.lon;fl['class']='Public';fl.reviewed=true;fl.last_checked=today();
      fl.origin='Added in sorter';fl.source='Hugh';fl.trips=0;fl.position_source='Tap on map';
      msg('Adding…');api('POST',{action:'add',fields:fl}).then(function(j){var np=norm(Object.assign({id:j.id},fl));pts.push(np);byId[np.id]=np;msg('Added '+np.name+'.');pending=null;if(draft){map.removeLayer(draft);draft=null}select(np.id)}).catch(function(e){msg('Not added: '+e.message,true)})}}));
    bar.appendChild(h('button',{text:'Cancel',onclick:closeDetail}));
  } else {
    bar.appendChild(h('button',{'class':'primary',text:'Save',onclick:function(){
      var fl=fields();if(!fl.name){msg('A name is needed.',true);return}
      var out={public_name:fl.public_name,river:fl.river,public_description:fl.public_description};
      if(newPos){out.lat=newPos.lat;out.lon=newPos.lon;out.os_grid_ref='';out.position_source='Moved in sorter';}
      save(p.id,out,'Saved.').then(function(){newPos=null;if(draft){map.removeLayer(draft);draft=null}showDetail(byId[p.id])})}}));
    bar.appendChild(h('button',{text:newPos?'Pick position again':'Move position',onclick:function(){moving=p.id;hint('Tap the new position on the map')}}));
    if(newPos)bar.appendChild(h('button',{text:'Cancel move',onclick:function(){newPos=null;if(draft){map.removeLayer(draft);draft=null}showDetail(p)}}));
    bar.appendChild(h('button',{'class':'danger',text:'Delete',onclick:function(){
      if(!confirm('Delete '+nm(p)+' from the sheet?'))return;
      var copy=Object.assign({},p);delete copy.id;
      api('POST',{action:'delete',id:p.id}).then(function(){pts=pts.filter(function(x){return x.id!==p.id});delete byId[p.id];closeDetail();
        msg('Deleted '+nm(p)+'.');
        $('msg').appendChild(h('button',{text:'Undo',onclick:function(){
          api('POST',{action:'add',fields:copy}).then(function(j){var np=norm(Object.assign({id:j.id},copy));pts.push(np);byId[np.id]=np;msg('Restored '+nm(np)+'.');render()}).catch(function(e){msg('Could not restore: '+e.message,true)})}}))
      }).catch(function(e){msg('Not deleted: '+e.message,true)})}}));
  }
  d.appendChild(bar)}
function closeDetail(){sel=null;pending=null;newPos=null;moving=null;var hb=$('hintbar');if(hb)hb.remove();$('map').style.cursor='';if(draft){map.removeLayer(draft);draft=null}$('detail').hidden=true;$('list').style.display='';render()}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* ---- toolbar ---- */
$('q').addEventListener('input',function(e){filt.q=e.target.value;render()});
$('unrev').addEventListener('change',function(e){filt.unrev=e.target.checked;render()});
$('addBtn').addEventListener('click',function(){adding=true;closeDetail();hint('Tap the map where the new point is')});
$('csvBtn').addEventListener('click',function(){
  var cols=['public_name','river','lat','lon','os_grid_ref','what3words','gauge','public_description'];
  function q(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  var rows=pts.filter(function(p){return p['class']==='Public'&&p.reviewed}).map(function(p){return cols.map(function(c){return q(p[c])}).join(',')});
  var blob=new Blob([cols.join(',')+'\n'+rows.join('\n')],{type:'text/csv'});
  var a=h('a',{href:URL.createObjectURL(blob),download:'common-access-points.csv'});document.body.appendChild(a);a.click();a.remove();msg(rows.length+' public points exported.')});
function openCfg(){$('cfgUrl').value=cfg.url;$('cfgKey').value=cfg.key;$('cfg').style.display='flex'}
$('cfgBtn').addEventListener('click',openCfg);
$('cfgCancel').addEventListener('click',function(){$('cfg').style.display='none'});

chips();
